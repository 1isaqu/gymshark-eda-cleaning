name: deploy dashboard

# Builds dashboard/ and publishes it to GitHub Pages at
# https://1isaqu.github.io/gymshark-eda-cleaning/
#
# The site is a static Vite build. It reads no secrets and talks to no
# backend: all figures come from the committed dashboard/src/data/findings.json,
# and the product photos are loaded straight from Shopify's CDN at view time.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ends up published rather than silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: install
        run: npm ci

      # Same gates that guard local work, so a broken build fails here
      # rather than shipping to the live URL.
      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build

      - uses: actions/configure-pages@v5

      # path is relative to the workspace root, not to `working-directory`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
